<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escola ECIT - 3D</title>
  <script type="module" src="https://googleapis.com"></script>
  <style>
    body { 
      margin: 0; 
      background-color: #e0e0e0; /* Fundo cinza claro para destacar o modelo */
      height: 100vh; 
    }
    model-viewer { 
      width: 100%; 
      height: 100%; 
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="escola-ecit.glb" 
    alt="Modelo 3D da Escola ECIT" 
    auto-rotate 
    camera-controls 
    exposure="2.0"
    environment-image="neutral"
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
