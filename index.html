<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escola ECIT - 3D</title>
  <script type="module" src="./model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background-color: #e0e0e0;
      height: 100vh;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
    #ar-prompt {
      position: absolute;
      left: 50%;
      bottom: 60px;
      transform: translateX(-50%);
      display: none;
    }
    model-viewer[ar-status="session-started"] > #ar-prompt {
      display: block;
    }
    #ar-button {
      background-color: #fff;
      border-radius: 18px;
      border: 1px solid #dadce0;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      font-family: sans-serif;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="./escola-ecit.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    tone-mapping="neutral" 
    shadow-intensity="1"
    auto-rotate>
    
    <div class="progress-bar hide" slot="progress-bar">
      <div class="update-bar"></div>
    </div>
    
    <button slot="ar-button" id="ar-button">
      Ver no seu espaço (AR)
    </button>
    
    <div id="ar-prompt">
      <img src="https://modelviewer.dev/shared-assets/icons/hand.png" alt="Mover celular">
    </div>
  </model-viewer>

</body>
</html>
